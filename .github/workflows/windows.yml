name: Windows portable
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Validate artwork tool
        run: |
          cargo fmt --manifest-path tools/assetgen/Cargo.toml --check
          cargo clippy --manifest-path tools/assetgen/Cargo.toml --locked -- -D warnings
          cargo run --manifest-path tools/assetgen/Cargo.toml --locked -- .
          git diff --exit-code -- assets
      - name: Package portable application
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PinWin-windows-x64-portable
          path: dist/*.zip
