[package]
name = "pinwin"
version = "2.0.0"
edition = "2021"
authors = ["Victor Zakharov", "Chiang-bc"]
description = "PinWin (Rust Rewrite) - High-performance native Win32 Always-on-Top window manager & DeskPins alternative"
license = "MIT"
repository = "https://github.com/VictorZakharov/pinwin"

[lib]
name = "pinwin"
path = "src/lib.rs"

[[bin]]
name = "PinWin"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
