[package]
name = "pinwin"
version = "2.0.0"
edition = "2024"
authors = ["Victor Zakharov", "Chiang-bc"]
description = "PinWin (Rust Rewrite) - High-performance native Win32 Always-on-Top window manager & DeskPins alternative"
license = "MIT"
repository = "https://github.com/VictorZakharov/pinwin"

[lib]
name = "pinwin"
path = "src/lib.rs"

[[bin]]
name = "PinWin"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
